version: "3.9"

services:
  db:
    image: postgres:15
    container_name: eve_healthcare_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: eve_healthcare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # healthcheck so the app waits for postgres to be ready
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: eve_healthcare_app
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/eve_healthcare
      SECRET_KEY: super-secret-key-change-this-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # mount code for live reload during development
      - .:/app

volumes:
  postgres_data:
